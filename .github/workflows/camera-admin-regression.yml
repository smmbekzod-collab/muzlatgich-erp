name: Camera admin regression tests
on:
  push:
    branches:
      - fix/camera-add-500-20261012
  pull_request:
    branches:
      - release/erp-v2-production-20261012
  workflow_dispatch:
jobs:
  django-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBUG: "1"
      SECRET_KEY: "test-secret-key-only"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test core.tests
      - run: python manage.py test
