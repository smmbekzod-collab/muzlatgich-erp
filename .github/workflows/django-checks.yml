name: Django checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system checks
        env:
          DEBUG: "1"
          SECRET_KEY: "temporary-ci-only"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py collectstatic --noinput
      - name: Automated regressions
        env:
          DEBUG: "1"
          SECRET_KEY: "temporary-ci-only"
        run: python manage.py test --verbosity 2

  postgres-concurrency:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: warehouse_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-temporary-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d warehouse_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DEBUG: "1"
      SECRET_KEY: "temporary-ci-only"
      DATABASE_URL: "postgresql://postgres:ci-temporary-only@127.0.0.1:5432/warehouse_ci"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: PostgreSQL parallel-dispatch/payment transactions
        run: python manage.py test warehouse.test_concurrency --verbosity 2
