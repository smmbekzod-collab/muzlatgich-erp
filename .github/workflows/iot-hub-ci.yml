name: IoT Hub tests (isolated)
on:
  push:
    branches:
      - feature/universal-iot-hub-25-camera-20261012
  workflow_dispatch:
concurrency:
  group: iot-hub-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    env:
      DEBUG: "1"
      SECRET_KEY: "ci-iot-hub-not-a-production-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Django checks, migrations and full regression
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test --verbosity 1
  postgres-iot:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: iot_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: only-ephemeral-ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d iot_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DEBUG: "1"
      SECRET_KEY: "ci-iot-hub-not-a-production-secret"
      DATABASE_URL: "postgresql://postgres:only-ephemeral-ci@127.0.0.1:5432/iot_ci"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: PostgreSQL IoT tenant isolation, replay and alert tests
        run: |
          python manage.py migrate --noinput
          python manage.py check
          python manage.py test warehouse.test_iot_hub warehouse.test_environment warehouse.test_telegram_alerts --verbosity 2

  edge-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline adapters: Wi-Fi HTTP, MQTT mapping, Modbus and queue
        run: python -m unittest scripts.test_iot_edge -v
