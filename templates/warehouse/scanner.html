{% extends 'warehouse/base.html' %}{% load static %}{% block content %}<h1>Partiya QR kodini skaner qiling</h1><p class="muted">Kamerani yoqing yoki QR tushirilgan rasmni tanlang.</p><div class="card form-card"><div id="reader"></div><p id="scan-error" role="alert"></p><label for="manual-id">Partiyaning to‘liq UUID kodi yoki QR havolasi</label><input id="manual-id" placeholder="QR havolasi yoki UUID"><div class="actions"><button type="button" id="manual-open">Partiyani ochish</button></div></div>{% endblock %}{% block scripts %}<script src="{% static 'warehouse/vendor/html5-qrcode.min.js' %}"></script><script>
(function(){let busy=false;const error=document.getElementById('scan-error');function openLot(text){const match=String(text).trim().match(/^(?:https?:\/\/[^/]+\/app\/lot\/)?([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\/?$/i);if(!match){error.textContent='Muzlatgich ERP partiya QR kodini tanlang.';return}if(busy)return;busy=true;location.assign('/app/lot/'+match[1]+'/')}
document.getElementById('manual-open').addEventListener('click',()=>openLot(document.getElementById('manual-id').value));if(typeof Html5QrcodeScanner==='undefined'){error.textContent='Skaner yuklanmadi. Sahifani yangilang yoki kodni qo‘lda kiriting.';return}const scanner=new Html5QrcodeScanner('reader',{fps:10,qrbox:{width:220,height:220}},false);scanner.render(openLot,()=>{});})();
</script>{% endblock %}
